<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bedel, acceso</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,system-ui,sans-serif;background:#f5f5f7;color:#1c1c1e}
  @media(prefers-color-scheme:dark){body{background:#000;color:#f2f2f7}input{background:#1c1c1e;color:#fff}}
  form{display:flex;flex-direction:column;gap:12px;width:min(320px,90vw)}
  input,button{font-size:1.1rem;padding:12px;border-radius:12px;border:1px solid #ccc}
  button{background:#2f7fc9;color:#fff;border:0;font-weight:600}
  .err{color:#d0342c;font-size:.9rem}
</style></head>
<body><form method="post" action="/login">
  <h1 style="margin:0;display:flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2f7fc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg> Bedel</h1>
  <input type="password" name="password" placeholder="Contraseña" autofocus autocomplete="current-password" required>
  <button type="submit">Entrar</button>
  <p class="err" id="err" hidden>Contraseña incorrecta</p>
</form>
<script>if(location.search.includes('error=1'))document.getElementById('err').hidden=false;</script>
</body></html>
