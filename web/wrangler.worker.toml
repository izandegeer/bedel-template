# web/wrangler.worker.toml - despliegue en Cloudflare Workers (el subdominio workers.dev de tu cuenta).
# Nombre no por defecto a proposito: si fuera wrangler.toml, "wrangler pages deploy" lo leeria y fallaria.
# Uso: npx wrangler deploy --config wrangler.worker.toml
name = "bedel"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Imprescindible: sin esto los assets (incluidos los JSON de data/) se servirian sin pedir contraseña.
run_worker_first = true

[observability]
enabled = true
